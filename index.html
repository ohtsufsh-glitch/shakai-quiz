;width:27px;height:27px;border-radius:8px;background:#edf4f6;color:#476979;font-size:13px;font-weight:800}.choice.selected{background:var(--primary-soft);border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}.choice.selected .letter{background:var(--primary);color:#fff}.text-answer{display:block;width:100%;min-height:54px;border:1.5px solid #bdcfd5;border-radius:12px;padding:12px 14px;font-size:18px;outline:none}.text-answer:focus{border-color:var(--primary);box-shadow:0 0 0 3px #08647718}.order-picked{min-height:48px;border:1px dashed #a8bdc5;background:#f8fbfc;padding:12px;border-radius:12px;margin:10px 0 12px}.order-chip{display:inline-flex;gap:5px;align-items:center;border-radius:9px;background:var(--primary-soft);margin:3px;padding:6px 10px;color:var(--primary-strong);font-size:13px}.order-chip button{border:0;background:none;color:var(--primary);font-weight:800;cursor:pointer;padding:0 3px}.confidence{padding-top:19px;margin-top:20px;border-top:1px solid var(--line)}.confidence .choices-inline{display:flex;gap:7px;flex-wrap:wrap}.tiny-choice{border:1px solid #bbd0d6;background:#fff;border-radius:11px;padding:10px 13px;font-size:13px;font-weight:600;color:#486979;cursor:pointer}.tiny-choice.chosen{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-strong)}.footnav{display:flex;gap:8px;margin-top:20px}.footnav .btn{flex:1}.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:18px}.dot{padding:0;width:21px;height:21px;border:1px solid #d1dfe3;background:#f1f6f7;border-radius:6px;cursor:pointer}.dot.done{background:#73aa9f;border-color:#73aa9f}.dot.now{outline:2px solid var(--primary);outline-offset:2px}.result-hero{text-align:center;background:linear-gradient(135deg,#0e6b79,#064c62);padding:22px;border-radius:18px;color:#fff}.result-hero strong{display:block;font-size:47px;line-height:1.25}.result-hero span{font-size:13px;color:#e0eff1}.statline{display:flex;align-items:center;justify-content:space-between;gap:10px;margi 'use strict';
const BANK = [{"id":"R2-HIS-01","domain":"歴史","topic":"鎌倉時代","kind":"order","skill":"年代・順序","level":"標準","stem":"次の出来事を、古い順に選んでください。","options":["文永の役（元軍の襲来）","御成敗式目が制定される","源頼朝が征夷大将軍に任命される","弘安の役（元軍の襲来）"],"answer":[2,1,0,3],"explanation":"源頼朝が征夷大将軍に任命（1192年）→御成敗式目（1232年・北条泰時）→文永の役（1274年・北条時宗）→弘安の役（1281年）の順です。","tags":["北条泰時","北条時宗","御成敗式目","元寇","鎌倉時代"],"origin":"第1回HIS-003の誤答、歴史の順序確認","ref_rate":null,"figure":null,"aliases":[],"handwriting":false,"sourceKind":"2026-10-31 第1回弱点克服テストの解答傾向を基に新規作問","points":1},{"id":"R2-HIS-02","domain":"歴史","topic":"鎌倉幕府の政治","kind":"short","skill":"人物と法令の関連づけ","level":"基礎","stem":"北条泰時が1232年に制定した、武士の裁判などの基準となった法の名前を漢字で答えてください。","options":[],"answer":"御成敗式目","explanation":"御成敗式目を定めたのは3代執権・北条泰時です。元寇に対応した8代執権・北条時宗と区別しましょう。","tags":["北条泰時","御成敗式目","鎌倉幕府"],"origin":"第1回HIS-003（北条時宗と誤答）","ref_rate":null,"figure":null,"aliases":[],"handwriting":false,"sourceKind":"2026-10-31 第1回弱点克服テストの解答傾向を基に新規作問","points":1},{"id":"R2-HIS-03","domain":"歴史","topic":"鎌倉幕府の政治","kind":"single","skill":"人物と出来事の比較","level":"基礎","stem":"文永の役と弘安の役の際、鎌倉幕府の8代執権として対応した人物は誰ですか。","options":["北条泰時","北条時宗","北条義時","北条政子"],"answer":1,"explanation":"北条時宗は8代執権で、元寇への対応にあたりました。北条泰時は御成敗式目を定めた3代執権です。","tags":["北条時宗","北条泰時","元寇"],"origin":"第1回HIS-003（北条泰時と時宗の混同）","ref_rate":null,"figure":null,"aliases":[],"handwriting":false,"sourceKind":"2026-10-31 第1回弱点克服テストの解答傾向を基に新規作問","points":1},{"id":"R2-HIS-04","domain":"歴史","topic":"鎌倉仏教","kind":"multi","skill":"宗教人物の比較・正誤","level":"標準","stem":"鎌倉時代の仏教に関する人物と宗派の組み合わせで、正しいものをすべて選んでください。","options":["栄西 ― 臨済宗","道元 ― 曹洞宗","法然 ― 日蓮宗","親鸞 ― 浄土真宗"],"answer":[0,1,3],"explanation":"栄西＝臨済宗、道元＝曹洞宗、法然＝浄土宗、親鸞＝浄土真宗、日蓮＝日蓮宗です。複数の対応を比較して覚えます。","tags":["栄西","道元","法然","親鸞","鎌倉仏教"],"origin":"第1回HIS-006（法然と曹洞宗を混同）","ref_rate":null,"figure":null,"aliases":[],"handwriting":false,"sourceKind":"2026-10-31 第1回弱点克服テストの解答傾向を基に新規作問","points":1},{"id":"R2-HIS-05","domain":"歴史","topic":"奈良・鎌倉の仏教文化","kind":"single","skill":"人物と業績の比較","level":"基礎","stem":"奈良時代、東大寺の大仏造立に協力し、各地で人々に仏教を広めた僧は誰ですか。","options":["運慶","行基","最澄","道元"],"answer":1,"explanation":"行基は奈良時代に活動し、東大寺の大仏造立に協力しました。一方、運慶は鎌倉時代の仏師で、東大寺南大門の金剛力士像などの制作に関わりました。","tags":["行基","運慶","東大寺","奈良時代","鎌倉時代"],"origin":"第1回HIS-007（運慶を行基と誤答）","ref_rate":null,"figure":null,"aliases":[],"handwriting":false,"sourceKind":"2026-10-31 第1回弱点克服テストの解答傾向を基に新規作問","points":1},{"id":"R2-HIS-06","domain":"歴史","topic":"奈良・鎌倉の仏教文化","kind":"multi","skill":"人物・時代・作品の照合","level":"標準","stem":"人物・時代・業績の組み合わせで正しいものをすべて選んでください。","options":["奈良時代の行基 ― 東大寺の大仏造立への協力","鎌倉時代の運慶ら ― 東大寺南大門の金剛力士像の制作","鎌倉時代の運慶 ― 奈良時代の大仏造立を指揮","奈良時代の鑑真 ― 臨済宗を日本へ伝える"],"answer":[0,1],"explanation":"行基は奈良時代、運慶は鎌倉時代。鑑真は唐から来日し戒律を伝えた僧で、臨済宗は栄西が伝えました。寺院名だけでなく、時代と業績をセットで区別します。","tags":["行基","運慶","鑑真","栄西","東大寺"],"origin":"第1回HIS-007（行基と運慶の混同）","ref_rate":null,"figure":null,"aliases":[],"handwriting":false,"sourceKind":"2026-10-31 第1回弱点克服テストの解答傾向を基に新規作問","points":1},{"id":"R2-GEO-01","domain":"地理","topic":"南西諸島と行政区分","kind":"multi","skill":"都道府県・島の比較","level":"標準","stem":"島と所属する都道府県の組み合わせとして正しいものをすべて選んでください。","options":["奄美大島 ― 鹿児島県","徳之島 ― 鹿児島県","石垣島 ― 沖縄県","宮古島 ― 鹿児島県"],"answer":[0,1,2],"explanation":"奄美大島・徳之島は鹿児島県、石垣島・宮古島は沖縄県に属します。地理的な近さと行政上の所属を区別しましょう。","tags":["奄美大島","徳之島","石垣島","宮古島","鹿児島県","沖縄県"],"origin":"第1回GEO-006（奄美大島を沖縄県と誤答）","ref_rate":null,"figure":null,"aliases":[],"handwriting":false,"sourceKind":"2026-10-31 第1回弱点克服テストの解答傾向を基に新規作問","points":1},{"id":"R2-GEO-02","domain":"地理","topic":"南西諸島と行政区分","kind":"single","skill":"位置の知識・分類","level":"基礎","stem":"次の島のうち、沖縄県に属する島はどれですか。","options":["屋久島","徳之島","石垣島","奄美大島"],"answer":2,"explanation":"石垣島は沖縄県です。屋久島・徳之島・奄美大島は鹿児島県です。","tags":["沖縄県","鹿児島県","島の位置","石垣島","奄美群島"],"origin":"第1回GEO-006（鹿児島県と沖縄県の混同）","ref_rate":null,"figure":null,"aliases":[],"handwriting":false,"sourceKind":"2026-10-31 第1回弱点克服テストの解答傾向を基に新規作問","points":1},{"id":"R2-GEO-03","domain":"地理","topic":"南西諸島と行政区分","kind":"short","skill":"選択肢なしの知識想起","level":"基礎","stem":"奄美群島に属する徳之島は、何県に属しますか。都道府県名を漢字で答えてください。","options":[],"answer":"鹿児島県","explanation":"徳之島・奄美大島は鹿児島県に属します。選択肢なしで鹿児島県と答えられるようにしましょう。","tags":["徳之島","奄美群島","鹿児島県"],"origin":"第1回GEO-006（所属県の誤答）","ref_rate":null,"figure":null,"aliases":[],"handwriting":false,"sourceKind":"2026-10-31 第1回弱点克服テストの解答傾向を基に新規作問","points":1},{"id":"R2-WR-01","domain":"歴史","topic":"近現代史","kind":"short","skill":"漢字書き取り・歴史の関連づけ","level":"基礎","stem":"日清戦争後の下関条約による賠償金の一部を使って建設され、1901年に操業を始めた官営工場の名称を漢字5字で答えてください。","options":[],"answer":"八幡製鉄所","explanation":"正解は八幡製鉄所。「幡」は「博」ではありません。書いてから正答と字形を見比べましょう。","tags":["日清戦争","下関条約","八幡製鉄所","幡の漢字"],"origin":"合不合第4回の漢字表記ミス・第1回HIS-101の手書き採点未記録","ref_rate":null,"figure":null,"aliases":[],"handwriting":true,"sourceKind":"2026-10-31 第1回弱点克服テストの解答傾向を基に新規作問","points":1},{"id":"R2-WR-02","domain":"公民","topic":"日本国憲法と天皇","kind":"short","skill":"漢字書き取り・憲法の基本","level":"基礎","stem":"日本国憲法第1条で、天皇は日本国および日本国民統合の何と定められていますか。漢字2字で答えてください。","options":[],"answer":"象徴","explanation":"正解は象徴。「徴」の右側は「攵（のぶん）」です。日本国憲法第1条の表現も確認しましょう。","tags":["象徴","天皇の地位","日本国憲法","徴の漢字"],"origin":"合不合第4回の漢字表記ミス・第1回CIV-105の手書き採点未記録","ref_rate":null,"figure":null,"aliases":[],"handwriting":true,"sourceKind":"2026-10-31 第1回弱点克服テストの解答傾向を基に新規作問","points":1},{"id":"R2-RET-01","domain":"歴史","topic":"室町文化","kind":"short","skill":"定着確認・人物と文化","level":"基礎","stem":"室町時代に活躍し、水墨画で知られる人物を漢字2字で答えてください。","options":[],"answer":"雪舟","explanation":"雪舟は室町時代に活躍した水墨画家です。今回は選択肢なしで思い出せたか確認します。","tags":["雪舟","水墨画","室町文化"],"origin":"第1回HIS-004で正答（選択式から記述式へ）","ref_rate":null,"figure":null,"aliases":[],"handwriting":false,"sourceKind":"2026-10-31 第1回弱点克服テストの解答傾向を基に新規作問","points":1},{"id":"R2-RET-02","domain":"地理","topic":"河川・雪解け","kind":"short","skill":"定着確認・河川の想起","level":"基礎","stem":"日本で最も長い川で、新潟県を通り日本海に注ぎ、雪解け期の春に流量が増えやすい川の名前を漢字で答えてください。","options":[],"answer":"信濃川","explanation":"信濃川は日本最長の川です。長野県では千曲川と呼ばれる区間もあり、日本海側や山地の雪解け水で春に流量が増えます。","tags":["信濃川","千曲川","雪解け","流量"],"origin":"第1回GEO-002で正答（資料選択から用語入力へ）","ref_rate":null,"figure":null,"aliases":[],"handwriting":false,"sourceKind":"202 const APP_VERSION='3.0.0', BANK_VERSION='social-weakness-2026-11-round2';
const STORAGE_HISTORY='shakai_weakness_v1_history', STORAGE_DRAFT='shakai_weakness_v1_draft';
const REASONS=['知らなかった','思い出せなかった','他の知識と混同した','漢字・表記ミス','問題・資料を読み違えた','時間不足・焦り','その他'];
let history=[],draft=null,screen='home',idx=0,ticker=0,storeAvailable=true,expandedReview=true,inkSession=null;
const app=document.getElementById('app');
const enc=(x)=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prettyDate=(s)=>{try{return new Date(s).toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch{return s||'---'}};
const uid=()=>('t'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10));
function readStore(key,otherwise){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):otherwise;}catch{storeAvailable=false;return otherwise;}}
function putStore(key,obj){try{localStorage.setItem(key,JSON.stringify(obj));}catch{storeAvailable=false;}}
function persist(){putStore(STORAGE_HISTORY,history);putStore(STORAGE_DRAFT,draft);}
function init(){history=readStore(STORAGE_HISTORY,[]);draft=readStore(STORAGE_DRAFT,null);if(!Array.isArray(history))history=[];if(!draft||draft.bankVersion!==BANK_VERSION||!Array.isArray(draft.answers)||draft.answers.length!==BANK.length)draft=null;render();}
function header(){return `<header class="top"><div class="brand"><span class="mark">社</span>弱点克服テスト</div><button type="button" data-action="home">ホームに戻る</button></header>`;}
function render(){app.innerHTML=header()+({home:homePage,quiz:quizPage,results:resultsPage,history:historyPage}[screen]||homePage)()+`<footer class="foot">問題・採点・履歴管理はこの端末内で動作します。<br>解答データは自動送信されません。｜バージョン ${APP_VERSION}</footer>`;setupHandwriting();}

function redrawStrokes(canvas,strokes){
 const r=canvas.getBoundingClientRect();if(!r.width)return;
 let dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));
 const c=canvas.getContext('2d');c.clearRect(0,0,canvas.width,canvas.height);c.strokeStyle='#183b53';c.fillStyle='#183b53';c.lineWidth=3.2*dpr;c.lineCap='round';c.lineJoin='round';
 for(const stroke of (strokes||[])){
  if(!Array.isArray(stroke)||!stroke.length)continue;
  c.beginPath();for(let i=0;i<stroke.length;i++){
    let pt=stroke[i],x=pt[0]/1000*canvas.width,y=pt[1]/1000*canvas.height;
    if(i===0)c.moveTo(x,y);else c.lineTo(x,y);
  }
  if(stroke.length===1){let pt=stroke[0];c.beginPath();c.arc(pt[0]/1000*canvas.width,pt[1]/1000*canvas.height,c.lineWidth/2,0,Math.PI*2);c.fill();}
  else c.stroke();
 }
}
function setupHandwriting(){
 const editable=document.querySelector('#handwriting-board');
 if(editable&&draft&&BANK[idx].handwriting){
   let ans=draft.answers[idx];if(!Array.isArray(ans.strokes))ans.strokes=[];
   redrawStrokes(editable,ans.strokes);
   let stroke=null;
   const coords=e=>{const r=editable.getBoundingClientRect();return [Math.max(0,Math.min(1000,Math.round((e.clientX-r.left)/r.width*1000))),Math.max(0,Math.min(1000,Math.round((e.clientY-r.top)/r.height*1000)))];};
   editable.addEventListener('pointerdown',e=>{e.preventDefault();if(e.button!==0&&e.pointerType==='mouse')return;stroke=[coords(e)];ans.strokes.push(stroke);try{editable.setPointerCapture(e.pointerId)}catch(_){}redrawStrokes(editable,ans.strokes);persist();});
   editable.addEventListener('pointermove',e=>{if(!stroke)return;e.preventDefault();let p=coords(e),prev=stroke[stroke.length-1];if(prev[0]!==p[0]||prev[1]!==p[1])stroke.push(p);redrawStrokes(editable,ans.strokes);});
   let done=e=>{if(stroke){stroke=null;persist();}};
   editable.addEventListener('pointerup',done);editable.addEventListener('pointercancel',done);
 }
 document.querySelectorAll('canvas[data-review-ink]').forEach(el=>{
    let i=Number(el.dataset.reviewInk),data=history.at(-1)?.items?.[i]?.strokes||[];
    redrawStrokes(el,data);
 });
}

function homePage(){let count=history.length;return `<section class="hero"><div class="eyebrow">第2回（11月）｜ 鎌倉時代・南西諸島・漢字</div><h1>社会の「わかる」を<br>「解ける」に変えよう。</h1><p>前回20問で見つかった苦手に絞った15問。鎌倉時代の人物と業績、奄美群島、漢字の書き取りを確認します。</p><div class="chips"><span>15問</span><span>目安15〜25分</span><span>Safari対応</span><span>自動採点</span></div></section>
<section class="card"><h2>テストを始める</h2><p class="lede">4択・複数選択・並べ替え・用語入力・漢字の手書きを組み合わせています。漢字の字形は機械採点せず、結果画面で見比べて記録します。</p><div class="metrics"><div class="metric"><strong>8問</strong><span>歴史</span></div><div class="metric"><strong>4問</strong><span>地理</span></div><div class="metric"><strong>3問</strong><span>公民・国際</span></div></div>
<div class="btnrow"><button class="btn primary" data-action="start">${draft?'続きから再開する' :'15問のテストを始める'}</button>${draft?'<button class="btn outline" data-action="restart">最初からやり直す</button>':''}</div>
<p class="small"><a href="round1.html">第1回・20問のテストを開く</a>（前回のテストも残しています）</p><div class="divider"></div><h3>回答すると記録できること</h3><ul class="info-list small"><li>分野・単元・問題形式・思考タイプ別の正答率</li><li>設問ごとの解答時間と自信度</li><li>不正解の原因・出題元の弱点・やり直し履歴</li><li>漢字はタッチ／Apple Pencilで書き、採点後に字形を自己判定</li></ul>${!storeAvailable?'<p class="notice warn">この表示方法では端末内の自動保存が使えない可能性があります。テスト終了後は必ずJSONを保存してください。</p>':''}</section>
<section class="card"><h2>学習結果とバックアップ</h2><p class="small">採点済み ${count}回分。JSONは復元・ChatGPT分析用、CSVは表計算用です。端末間の自動同期はありません。</p><div class="btnrow"><button class="btn subtle" data-action="history">過去の結果を見る</button><button class="btn outline" data-action="export-json">JSONで保存</button><button class="btn outline" data-action="export-csv">CSVで保存</button></div><div class="btnrow" style="margin-top:9px"><button class="btn outline" data-action="import">保存したJSONを読み込む</button><input id="import-file" type="file" accept=".json,application/json" aria-label="結果JSONを選ぶ"></div><p class="notice">SafariのWebサイト版です。前回の採点済み履歴は引き継ぎます。端末変更時はJSONを保存してから読み込んでください。</p></section>`;}
function newDraft(){return {id:uid(),bankVersion:BANK_VERSION,startedAt:new Date().toISOString(),answers:BANK.map(()=>({response:null,confidence:null,seconds:0,strokes:[]})),currentIndex:0};}
function start(reset=false){if(reset||!draft)draft=newDraft();idx=draft.currentIndex||0;screen='quiz';ticker=Date.now();persist();render();window.scrollTo(0,0);}
function pauseTimer(){if(!draft||screen!=='quiz'||!ticker)return;let delta=(Date.now()-ticker)/1000;if(delta>=0&&delta<600)draft.answers[idx].seconds=Math.round((draft.answers[idx].seconds+delta)*10)/10;ticker=Date.now();persist();}
function resumeTimer(){ticker=Date.now();}
function isAnswered(q,a){if(!a)return false;if(q.kind==='single')return Number.isInteger(a.response);if(q.kind==='multi')return Array.isArray(a.response)&&a.response.length>0;if(q.kind==='order')return Array.isArray(a.response)&&a.response.length===q.options.length;if(q.kind==='short')return typeof a.response==='string'&&a.response.trim().length>0;return false;}
function currentCount(){return BANK.reduce((n,q,i)=>n+(isAnswered(q,draft.answers[i])?1:0),0);}
function radioChoice(q,a,i){let selected=(q.kind==='single'?a.response===i:Array.isArray(a.response)&&a.response.includes(i));return `<button class="choice ${selected?'selected':''}" type="button" data-action="choose" data-val="${i}" aria-pressed="${selected}"><span class="letter">${'アイウエオカキク'[i]||i+1}</span><span>${enc(q.options[i])}</span></button>`;}
function figure(q){if(q.figure!=='snowmelt')return '';let vals=[3,3,5,10,7,4,3,3,4,4,3,3], poly=vals.map((y,i)=>`${32+i*24},${117-y*8}`).join(' ');let labs=vals.map((_,i)=>`<text x="${32+i*24}" y="137" text-anchor="middle" font-size="9" fill="#5d7785">${i+1}</text>`).join('');return `<div class="figure"><svg viewBox="0 0 325 156" role="img" aria-label="信濃川の月別流量をイメージした模式図。4月ごろに山がある"><rect x="91" y="16" width="48" height="105" rx="7" fill="#d4e9ed"/><line x1="20" y1="119" x2="311" y2="119" stroke="#8da7b0"/><line x1="20" y1="27" x2="20" y2="119" stroke="#8da7b0"/><polyline points="${poly}" fill="none" stroke="#0a7182" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${labs}<text x="10" y="14" font-size="10" fill="#577482">流量（相対的な大きさ）</text><text x="291" y="149" font-size="10" fill="#577482">月</text></svg><p>学習用の模式図です。実測データではありません。</p></div>`;}
function quizPage(){if(!draft){screen='home';return homePage();}let q=BANK[idx],a=draft.answers[idx],done=currentCount();let controls='';if(q.kind==='single'||q.kind==='multi')controls=`${q.kind==='multi'?'<p class="help">正しいと思う選択肢をすべてタップ（複数可）。</p>':''}<div class="choices">${q.options.map((_,i)=>radioChoice(q,a,i)).join('')}</div>`;
else if(q.kind==='short')controls=`${q.handwriting?`<section class="writing-module"><h3>✏️ 先に漢字を手書きしよう</h3><p class="small">指やApple Pencilで、答えを見ずに書きましょう。</p><canvas id="handwriting-board" class="writing-board" aria-label="手書き解答欄"></canvas><div class="writing-tools"><span class="small">字形は後で自分で採点します</span><button type="button" data-action="erase-handwriting">書き直す</button></div></section>`:''}<label for="short-answer" class="help" style="display:block;margin:13px 0 6px">文字入力による回答（自動採点用）</label><input id="short-answer" class="text-answer" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="漢字・かなを入力" value="${enc(a.response||'')}" /><p class="kanji-warning">日本語変換で正しい字を選べても、手書きで書けたとは判定しません。手書きの正誤は採点後に選んでください。</p>`;
else if(q.kind==='order'){let picked=Array.isArray(a.response)?a.response:[];controls=`<p class="help">古い順に選択肢をタップ。選んだ項目は「取り消す」で戻せます。</p><div class="order-picked">${picked.length?picked.map((v,i)=>`<span class="order-chip">${i+1}. ${enc(q.options[v])}<button type="button" data-action="remove-order" data-val="${v}" aria-label="${enc(q.options[v])}を取り消す">×</button></span>`).join(''):'ここに選んだ順番が表示されます'}</div><div class="choices">${q.options.map((v,i)=>picked.includes(i)?'':`<button class="choice" data-action="order" data-val="${i}"><span class="letter">＋</span><span>${enc(v)}</span></button>`).join('')}</div>`;}
return `<section class="card"><div class="sectiontop"><span>問題 ${idx+1} / ${BANK.length}</span><span>回答済み ${done}問</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${BANK.length}" aria-valuenow="${done}"><div style="width:${done/BANK.length*100}%"></div></div><div class="qmeta"><span class="pill level">${enc(q.domain)}</span><span class="pill">${enc(q.topic)}</span><span class="pill">${enc(q.skill)}</span></div><h1 class="qtitle">${enc(q.stem)}</h1>${figure(q)}${controls}<div class="confidence"><h3>答えの自信は？ <span class="small" style="font-weight:400">（任意）</span></h3><div class="choices-inline">${['自信あり','少し迷った','勘で答えた'].map(v=>`<button class="tiny-choice ${a.confidence===v?'chosen':''}" data-action="confidence" data-value="${v}" aria-pressed="${a.confidence===v}">${v}</button>`).join('')}</div></div><nav class="footnav"><button class="btn outline" data-action="prev" ${idx===0?'disabled':''}>前の問題</button><button class="btn primary" data-action="next">${idx===BANK.length-1?'採点へ進む':'次の問題'}</button></nav><div class="dots" aria-label="問題番号へ移動">${BANK.map((question,i)=>`<button type="button" class="dot ${isAnswered(question,draft.answers[i])?'done':''} ${idx===i?'now':''}" data-action="jump" data-val="${i}" aria-label="問題${i+1}${isAnswered(question,draft.answers[i])?'、回答済み':''}" title="問題${i+1}"></button>`).join('')}</div><div class="divider"></div><div class="btnrow"><button class="btn subtle" data-action="finish" ${done!==BANK.length?'disabled':''}>20問すべてを採点する</button><button class="btn outline" data-action="save-home">途中保存して戻る</button></div></section>`;}
function rawResponse(q,a){if(q.kind==='single')return q.options[a.response]??'未回答';if(q.kind==='multi'||q.kind==='order')return Array.isArray(a.response)?a.response.map(i=>q.options[i]).join(q.kind==='order'?' → ':' ／ '):'未回答';return String(a.response??'未回答');}
function norm(x){return String(x||'').normalize('NFKC').replace(/[\s\u3000]/g,'').toLowerCase();}
function correct(q,response){if(q.kind==='single')return response===q.answer;if(q.kind==='multi')return Array.isArray(response)&&JSON.stringify([...response].sort((a,b)=>a-b))===JSON.stringify([...q.answer].sort((a,b)=>a-b));if(q.kind==='order')return JSON.stringify(response)===JSON.stringify(q.answer);if(q.kind==='short')return [q.answer,...q.aliases].some(x=>norm(x)===norm(response));return false;}
function expected(q){return rawResponse(q,{response:q.answer});}
function finish(){pauseTimer();if(!draft)return;let todo=BANK.map((q,i)=>!isAnswered(q,draft.answers[i])?i+1:null).filter(Boolean);if(todo.length){alert(`未回答の問題があります：${todo.join('、')}。\nすべて回答してから採点します。`);return;}const attempt={id:draft.id,schemaVersion:1,bankVersion:BANK_VERSION,startedAt:draft.startedAt,completedAt:new Date().toISOString(),items:BANK.map((q,i)=>({questionId:q.id,domain:q.domain,topic:q.topic,skill:q.skill,kind:q.kind,level:q.level,tags:[...q.tags],stem:q.stem,origin:q.origin,refRate:q.ref_rate,response:draft.answers[i].response,responseText:rawResponse(q,draft.answers[i]),correctAnswer:q.answer,correctText:expected(q),isCorrect:correct(q,draft.answers[i].response),seconds:Math.round(draft.answers[i].seconds*10)/10,strokes:q.handwriting?(draft.answers[i].strokes||[]):[],handwritingRequired:!!q.handwriting,confidence:draft.answers[i].confidence||'',errorReason:'',writingAssessment:''}))}; history.push(attempt);draft=null;persist();screen='results';render();window.scrollTo(0,0);}
function statRows(items,field){const m={};for(const a of items){let key=a[field]||'未分類';if(!m[key])m[key]={n:0,ok:0,sec:0};m[key].n++;if(a.isCorrect)m[key].ok++;m[key].sec+=a.seconds||0;}return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0],'ja')).map(([name,s])=>`<div class="statline"><span style="flex:0 0 112px">${enc(name)}<br><span class="small">${s.ok}/${s.n}問</span></span><div class="bar"><div style="width:${s.ok/s.n*100}%"></div></div><strong>${Math.round(s.ok/s.n*100)}%</strong></div>`).join('');}
function focusFeedback(items){let missed=items.filter(i=>!i.isCorrect);if(!missed.length)return '<p class="notice ok">全問正解です。次は日を空けて同じ知識を別の聞き方で確認しましょう。</p>';let groups={};for(let item of missed){let k=item.domain+'／'+item.topic;groups[k]=(groups[k]||0)+1;}let top=Object.entries(groups).sort((a,b)=>b[1]-a[1]).slice(0,4);let hwMiss=items.filter(i=>i.writingAssessment==='漢字・表記を間違えた'||i.writingAssessment==='書けなかった').length;
return '<div class="notice warn"><b>今回の復習候補</b><br>'+top.map(([k,n])=>enc(k)+'（'+n+'問）').join(' ・ ')+(hwMiss?'<br>手書き未定着：'+hwMiss+'問':'')+'<br><span style="font-size:12px">各単元の出題数が少ないため、弱点の確定には再出題が必要です。</span></div>';}
function writingReview(a,i){if(a.kind!=='short'||!a.handwritingRequired)return '';const choices=['未確認','正しく手書きできた','漢字・表記を間違えた','書けなかった'];return `<p class="small" style="margin:13px 0 5px"><strong>手書きの字と正解を見比べてください：</strong></p><canvas class="review-writing" data-review-ink="${i}" aria-label="あなたが書いた字"></canvas><p class="small">手書きの判定（文字入力の正誤とは独立です）：</p><div class="reason-row">${choices.map((r,k)=>`<button type="button" data-action="writecheck" data-index="${i}" data-val="${k}" class="${(a.writingAssessment||'未確認')===r?'chosen':''}">${enc(r)}</button>`).join('')}</div>`;}
function resultsPage(){if(!history.length){screen='home';return homePage();}let last=history.at(-1),items=last.items,hit=items.filter(x=>x.isCorrect).length;return `<section class="card"><div class="result-hero"><span>診断テスト結果｜${enc(prettyDate(last.completedAt))}</span><strong>${hit}<small style="font-size:21px"> / ${items.length}問</small></strong><span>正答率 ${Math.round(hit/items.length*100)}% ・回答時間の合計 ${Math.round(items.reduce((s,x)=>s+x.seconds,0)/60)}分</span></div><p class="notice" style="margin-top:15px">ここでの正答率は文字入力・選択肢による自動採点です。<strong>手書きの字形は自動判定していません。</strong>下の各設問で手書きの結果を登録し、両者を分けて分析します。新規問題に受験生全体の正答率はありません。</p><p class="notice">手書き要確認：${items.filter(i=>i.handwritingRequired&&(!i.writingAssessment||i.writingAssessment==='未確認')).length}問 ／ 手書き誤り・書けない：${items.filter(i=>['漢字・表記を間違えた','書けなかった'].includes(i.writingAssessment)).length}問</p>${focusFeedback(items)}<h2 style="margin-top:22px">分野別の正答率</h2>${statRows(items,'domain')}<h2 style="margin-top:22px">問題形式別の正答率</h2>${statRows(items,'kindLabel')}<h2 style="margin-top:22px">思考タイプ別の正答率</h2>${statRows(items,'skill')}<h2 style="margin-top:22px">単元別の正答率</h2>${statRows(items,'topic')}<div class="divider"></div><div class="btnrow"><button class="btn primary" data-action="export-json">JSONを保存</button><button class="btn outline" data-action="export-csv">CSVを保存</button></div></section><section class="card"><h2>設問ごとの振り返り</h2><p class="small">不正解の理由と、漢字・表記の自己判定を記録してください。<b>「入力は正解だが手書きで誤字」</b>も記録されます。</p>${items.map((a,i)=>{let q=BANK.find(q=>q.id===a.questionId);return `<div class="review"><span class="status ${a.isCorrect?'good':'bad'}">${a.isCorrect?'正解':'不正解'}</span><span class="small">${enc(a.domain)}／${enc(a.topic)}／${Math.round(a.seconds)}秒</span><div class="review-title">${i+1}. ${enc(a.stem)}</div><div class="small">あなたの解答：<b>${enc(a.responseText)}</b></div>${(!a.isCorrect||a.handwritingRequired)?`<div class="small">正解：<b style="color:var(--good)">${enc(a.correctText)}</b></div>`:''}<div class="explanation">${enc(q?.explanation||'解説なし')}</div><div class="tagbar">${(a.tags||[]).map(t=>`<span>${enc(t)}</span>`).join('')}</div>${writingReview(a,i)}${!a.isCorrect?`<p class="small" style="margin:12px 0 5px">間違えた原因（任意）：</p><div class="reason-row">${REASONS.map((r,k)=>`<button type="button" data-action="reason" data-index="${i}" data-val="${k}" class="${a.errorReason===r?'chosen':''}">${enc(r)}</button>`).join('')}</div>`:''}</div>`}).join('')}<div class="btnrow"><button class="btn primary" data-action="export-json">原因も含めてJSON保存</button><button class="btn outline" data-action="restart">同じ15問を再挑戦</button></div></section>`;}
const kindLabel={single:'4択',multi:'複数選択',short:'用語入力',order:'並べ替え'};
function historyPage(){let n=history.length;let results=history.map(a=>({id:a.id,completedAt:a.completedAt,score:a.items.filter(x=>x.isCorrect).length,total:a.items.length}));return `<section class="card"><h2>これまでの学習記録</h2><p class="small">採点済み ${n}回分（この端末内、またはJSONから取り込んだ履歴）。別端末とは自動同期されません。</p>${n?`<div class="history-list">${results.slice().reverse().map(a=>`<div class="history-item"><div class="history-head"><strong>${enc(prettyDate(a.completedAt))}</strong><strong>${a.score}/${a.total}問</strong></div><div class="small">正答率 ${Math.round(a.score/a.total*100)}%</div></div>`).join('')}</div>`:'<p class="notice">まだ採点済みの結果がありません。</p>'}${n?`<div class="divider"></div><h2>これまでの累積・分野別正答率</h2><p class="small">同じ問題への再挑戦も1回ずつ集計しています。手書き自己採点の「誤り・書けない」：${history.flatMap(a=>a.items).filter(i=>['漢字・表記を間違えた','書けなかった'].includes(i.writingAssessment)).length}件。</p>${statRows(history.flatMap(a=>a.items),'domain')}`:''}<div class="divider"></div><div class="btnrow"><button class="btn primary" data-action="export-json">結果をJSONで保存</button><button class="btn outline" data-action="export-csv">結果をCSVで保存</button></div><div class="btnrow" style="margin-top:8px"><button class="btn outline" data-action="import">JSONから復元</button><input id="import-file" type="file" accept=".json,application/json" aria-label="結果JSONを選ぶ"><button class="btn danger" data-action="delete">この端末の記録を削除</button></div></section>`;}
function navTo(n){if(screen==='quiz')pauseTimer();screen=n;render();window.scrollTo(0,0);}
function csvQuote(s){let v=String(s??'');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replaceAll('"','""')+'"';}
function download(file,content,type){try{let blob=new Blob([content],{type});let href=URL.createObjectURL(blob),a=document.createElement('a');a.href=href;a.download=file;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),20000);}catch(e){alert('ファイルの保存を開始できませんでした。Safariで開いて再度お試しください。');}}
function exportJSON(){if(screen==='quiz')pauseTimer();let obj={fileType:'shakai-weakness-backup',schemaVersion:1,createdAt:new Date().toISOString(),bankVersion:BANK_VERSION,appVersion:APP_VERSION,completedAttempts:history,inProgress:draft,questionBank:BANK,notes:'氏名は含めません。手書きは描画線の座標で保存。文字入力の自動採点と手書きの自己判定は別々の項目で記録しています。'};download(`社会_学習履歴_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(obj,null,2),'application/json;charset=utf-8');}
function exportCSV(){if(!history.length){alert('採点済みの履歴がありません。テストを採点してからCSVを保存してください。');return;}let headers=['attempt_id','completed_at','question_id','domain','topic','skill','kind','level','tags','origin','reference_correct_rate_pct','question','answer','correct_answer','is_correct','response_seconds','confidence','error_reason','writing_assessment','handwritten_stroke_count','requires_handwriting','needs_review'];let rows=[headers];for(let a of history)for(let i of a.items){rows.push([a.id,a.completedAt,i.questionId,i.domain,i.topic,i.skill,kindLabel[i.kind]||i.kind,i.level,(i.tags||[]).join('|'),i.origin,i.refRate??'',i.stem,i.responseText,i.correctText,i.isCorrect?'1':'0',i.seconds,i.confidence,i.errorReason||'',i.writingAssessment||'',(i.strokes||[]).length,i.handwritingRequired?'1':'0',(!i.isCorrect||['漢字・表記を間違えた','書けなかった'].includes(i.writingAssessment))?'1':'0']);}let csv='\ufeff'+rows.map(r=>r.map(csvQuote).join(',')).join('\r\n');download(`社会_解答結果_${new Date().toISOString().slice(0,10)}.csv`,csv,'text/csv;charset=utf-8');}
async function importJSON(file){try{const parsed=JSON.parse(await file.text());if(parsed.fileType!=='shakai-weakness-backup'||parsed.schemaVersion!==1||!Array.isArray(parsed.completedAttempts)||parsed.completedAttempts.length>5000)throw Error('対応する学習履歴JSONではありません。');let incoming=parsed.completedAttempts.filter(a=>a&&typeof a.id==='string'&&a.id.length<160&&Array.isArray(a.items)&&a.items.length>0&&a.items.length<=100&&a.items.every(i=>typeof i.questionId==='string'&&typeof i.isCorrect==='boolean'));if(incoming.length!==parsed.completedAttempts.length)throw Error('問題のあるデータが含まれています。');let ids=new Set(history.map(a=>a.id));let added=0;for(let a of incoming)if(!ids.has(a.id)){history.push(a);ids.add(a.id);added++;}history.sort((a,b)=>String(a.completedAt).localeCompare(String(b.completedAt)));if(!draft&&parsed.inProgress&&parsed.inProgress.bankVersion===BANK_VERSION&&Array.isArray(parsed.inProgress.answers)&&parsed.inProgress.answers.length===BANK.length)draft=parsed.inProgress;persist();alert(`${added}回分の記録を追加しました。\n既存の記録と重なるIDは取り込みません。`);render();}catch(e){alert('JSONを読み込めませんでした。\n'+e.message);}}
function applyAction(action,el){if(action==='home'||action==='save-home'){navTo('home');return;}if(action==='start'){start();return;}if(action==='restart'){if(!history.length||confirm('新しい解答を開始します。前の採点済み履歴は残ります。よろしいですか？'))start(true);return;}if(action==='history'){navTo('history');return;}if(action==='export-json'){exportJSON();return;}if(action==='export-csv'){exportCSV();return;}if(action==='import'){document.getElementById('import-file')?.click();return;}if(action==='delete'){if(confirm('この端末内の採点済み履歴と解答途中のデータをすべて削除しますか？\nバックアップがなければ元に戻せません。')){history=[];draft=null;persist();navTo('home');}return;}
if(!draft&&screen==='quiz')return;
if(action==='choose'){let q=BANK[idx],a=draft.answers[idx],v=Number(el.dataset.val);if(q.kind==='single')a.response=v;else {let set=new Set(Array.isArray(a.response)?a.response:[]);if(set.has(v))set.delete(v);else set.add(v);a.response=[...set].sort((x,y)=>x-y);}persist();render();return;}
if(action==='confidence'){draft.answers[idx].confidence=el.dataset.value;persist();render();return;}
if(action==='erase-handwriting'){draft.answers[idx].strokes=[];persist();render();return;}
if(action==='order'||action==='remove-order'){let a=draft.answers[idx],v=Number(el.dataset.val);if(!Array.isArray(a.response))a.response=[];if(action==='order'&&!a.response.includes(v))a.response.push(v);if(action==='remove-order')a.response=a.response.filter(x=>x!==v);persist();render();return;}
if(action==='prev'||action==='next'||action==='jump'){pauseTimer();if(action==='jump')idx=Number(el.dataset.val);else if(action==='prev')idx=Math.max(0,idx-1);else if(idx===BANK.length-1){finish();return;}else idx++;draft.currentIndex=idx;persist();render();window.scrollTo({top:0,behavior:'instant'});return;}
if(action==='finish'){finish();return;}
if(action==='writecheck'){let lastAttempt=history.at(-1);if(!lastAttempt)return;let a=lastAttempt.items[Number(el.dataset.index)],options=['未確認','正しく手書きできた','漢字・表記を間違えた','書けなかった'];if(!a)return;a.writingAssessment=options[Number(el.dataset.val)];persist();render();return;}
if(action==='reason'){let last=history.at(-1);if(!last)return;let ans=last.items[Number(el.dataset.index)],r=REASONS[Number(el.dataset.val)];ans.errorReason=ans.errorReason===r?'':r;persist();render();return;}
}
app.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;applyAction(el.dataset.action,el);});
app.addEventListener('input',e=>{if(e.target.id==='short-answer'&&draft&&screen==='quiz'){draft.answers[idx].response=e.target.value;persist();}});
app.addEventListener('change',e=>{if(e.target.id==='import-file'&&e.target.files?.[0]){importJSON(e.target.files[0]);e.target.value='';}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseTimer();}else if(screen==='quiz'){resumeTimer();}});
window.addEventListener('pagehide',()=>{if(screen==='quiz')pauseTimer();});
// Assign a durable, human-readable display label to each answer in a saved attempt.
const originalFinish=finish;
finish=function(){originalFinish();if(history.length&&screen==='results'){history.at(-1).items.forEach(i=>{i.kindLabel=kindLabel[i.kind]||i.kind;});persist();render();}};
// Support histories saved before labels were introduced.
const originalStatRows=statRows;
statRows=function(items,field){if(field==='kindLabel')items=items.map(i=>({...i,kindLabel:kindLabel[i.kind]||i.kind}));return originalStatRows(items,field);};
init();
</script>
